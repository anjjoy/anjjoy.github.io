<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
    <title>Our Templates — AnjHub</title>
    <meta name="description" content="Browse all AnjHub website templates for hair salons, barbershops and beauty studios.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2F5597;
            --primary-dark: #284a85;
            --deep: #162E60;
            --heading: #15243B;
            --body: #3D4F66;
            --border: #D9DFE7;
            --bg: #f4f6fa;
            --tint: #e3ebf7;
        }
        html { scroll-behavior: smooth; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: var(--body); background: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        a { text-decoration: none; }

        /* Header */
        header { background: #fff; box-shadow: 0 1px 3px rgba(21,36,59,0.12); position: fixed; width: 100%; top: 0; z-index: 1000; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; }
        .logo { display: inline-flex; align-items: center; }
        .logo img { height: 50px; width: auto; display: block; }
        .nav-links { display: flex; gap: 30px; list-style: none; align-items: center; }
        .nav-links a { color: var(--heading); font-weight: 500; transition: color .2s; }
        .nav-links a:hover { color: var(--primary); }
        .nav-cta { display: inline-block; background: var(--primary); color: #fff !important; padding: 9px 20px; border-radius: 8px; font-weight: 600; transition: background .2s; }
        .nav-cta:hover { background: var(--primary-dark); }

        /* Buttons */
        .btn { display: inline-block; padding: 13px 28px; border-radius: 8px; font-weight: 600; transition: all .2s; border: 2px solid transparent; cursor: pointer; font-size: 16px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-outline { border-color: var(--primary); color: var(--primary); background: transparent; }
        .btn-outline:hover { background: var(--primary); color: #fff; }

        /* Page title */
        .page-title { margin-top: 88px; padding: 60px 0 40px; background: linear-gradient(135deg, #eef3fb 0%, #dbe6f6 100%); text-align: center; }
        .page-title h1 { font-size: 38px; color: var(--heading); margin-bottom: 10px; }
        .page-title p { font-size: 17px; color: var(--body); }

        /* Templates */
        .templates { background: var(--bg); padding: 50px 0 70px; min-height: 400px; }
        .templates-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
        .template-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(21,36,59,.08); transition: transform .2s; }
        .template-card:hover { transform: translateY(-5px); }
        .template-img { width: 100%; height: 210px; object-fit: cover; display: block; background: #e9eef5; }
        .template-info { padding: 22px 24px 26px; }
        .template-info h3 { font-size: 20px; margin-bottom: 6px; color: var(--heading); }
        .template-info p { color: var(--body); font-size: 14px; margin-bottom: 16px; min-height: 42px; }
        .template-row { display: flex; align-items: center; justify-content: space-between; }
        .template-price { font-size: 20px; font-weight: 700; color: var(--primary); }
        .template-price small { font-size: 13px; color: #9aa6b8; font-weight: 400; }
        .template-info .btn { padding: 9px 18px; font-size: 14px; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 44px; flex-wrap: wrap; }
        .pagination button { min-width: 40px; height: 40px; border: 1px solid var(--border); background: #fff; color: var(--heading); border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 500; transition: all .15s; padding: 0 12px; }
        .pagination button:hover:not(:disabled):not(.active) { border-color: var(--primary); color: var(--primary); }
        .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination button:disabled { opacity: .4; cursor: not-allowed; }
        .pagination .page-info { color: #9aa6b8; font-size: 14px; margin: 0 12px; }

        /* Footer */
        footer { background: var(--heading); color: #9aa6b8; padding: 38px 0; text-align: center; }
        .footer-links { margin-bottom: 16px; }
        footer a { color: #9aa6b8; margin: 0 12px; font-size: 15px; }
        footer a:hover { color: #fff; }
        footer p { font-size: 14px; }

        @media (max-width: 768px) {
            .page-title h1 { font-size: 28px; }
            .nav-links { display: none; }
            .logo img { height: 38px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo"><img src="../assets/brand/anjhub-logo.svg" alt="AnjHub"></a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="pricing.html">Pricing</a></li>
                    <li><a href="templates.html">Templates</a></li>
                    <li><a href="index.html#features">Why AnjHub</a></li>
                    <li><a href="pricing.html" class="nav-cta">Start Free Trial</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-title">
        <div class="container">
            <h1>Our Templates</h1>
            <p>Professional, ready-to-use website templates for hair salons, barbershops and beauty studios.</p>
        </div>
    </div>

    <section class="templates">
        <div class="container">
            <div class="templates-grid" id="templatesGrid">
                <div class="template-card"><div class="template-info"><p style="text-align:center;color:#9aa6b8;">Loading templates…</p></div></div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="pricing.html">Pricing</a>
                <a href="templates.html">Templates</a>
                <a href="index.html#features">Why AnjHub</a>
            </div>
            <p>&copy; 2026 AnjHub. All rights reserved.</p>
        </div>
    </footer>

    <script>
        var PER_PAGE = 15;
        var ALL_TEMPLATES = [];
        var currentPage = 1;
        var totalPages = 1;

        function renderTemplates(templates) {
            var grid = document.getElementById('templatesGrid');
            if (!templates.length) {
                grid.innerHTML = '<div class="template-card"><div class="template-info"><p style="text-align:center;color:#9aa6b8;">No templates available yet.</p></div></div>';
                return;
            }
            grid.innerHTML = templates.map(function (t) {
                var name = t.name || 'Untitled';
                var desc = t.description || 'A professional website template for your business.';
                if (desc.length > 120) desc = desc.substring(0, 117) + '…';
                var thumb = t.thumb_src || '';
                var img = thumb
                    ? '<img class="template-img" src="' + thumb + '" alt="' + name + ' template preview" loading="lazy" onerror="this.style.display=\'none\'">'
                    : '';
                return '<div class="template-card">' + img +
                    '<div class="template-info">' +
                    '<h3>' + name + '</h3>' +
                    '<p>' + desc + '</p>' +
                    '<div class="template-row">' +
                    '<div class="template-price">Included <small>with any plan</small></div>' +
                    '<a href="pricing.html" class="btn btn-outline">Use Template</a>' +
                    '</div></div></div>';
            }).join('');
        }

        function renderPagination() {
            var pg = document.getElementById('pagination');
            var html = '';
            html += '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="loadPage(' + (currentPage - 1) + ')">← Prev</button>';
            html += '<span class="page-info">Page ' + currentPage + ' of ' + totalPages + '</span>';
            html += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="loadPage(' + (currentPage + 1) + ')">Next →</button>';
            pg.innerHTML = html;
        }

        function loadPage(page) {
            currentPage = page;
            var start = (page - 1) * PER_PAGE;
            var pageItems = ALL_TEMPLATES.slice(start, start + PER_PAGE);
            renderTemplates(pageItems);
            renderPagination();
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        // 加载静态 JSON 并初始化
        fetch('data/templates.json')
            .then(function (r) { return r.json(); })
            .then(function (res) {
                ALL_TEMPLATES = (res && res.templates) || [];
                totalPages = Math.max(1, Math.ceil(ALL_TEMPLATES.length / PER_PAGE));
                loadPage(1);
            })
            .catch(function () {
                document.getElementById('templatesGrid').innerHTML =
                    '<div class="template-card"><div class="template-info"><p style="text-align:center;color:#9aa6b8;">Failed to load templates.</p></div></div>';
            });
    </script>
</body>
</html>
